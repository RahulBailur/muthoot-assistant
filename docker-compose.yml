# docker compose up --build -d                     → the app on :8000 (APP_PORT=8001 for another)
# docker compose exec app python -m scripts.seed_data   → the demo data (once)
# docker compose --profile offline up -d ollama    → optional local LLM fallback

name: goldloan

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Inside Compose the databases are reached by service name, whatever .env says
      MONGO_URI: mongodb://mongo:27017/goldloan
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_DB: "false"
      OLLAMA_URL: http://ollama:11434
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    # No published port: this database has no password, and only the app needs it.
    # To look inside: docker compose exec mongo mongosh goldloan
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No published port, like mongo. To look inside: docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["offline"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  mongo_data:
  models:
  ollama_data:
