[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldloan-backend"
version = "0.1.0"
description = "Gold-loan voice assistant (client demo POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "beanie>=1.29,<2",
    "motor>=3.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
    "ruff>=0.6.9",
    "mypy>=1.11",
]

[tool.setuptools]
py-modules = [
    "auth_utils",
    "config",
    "database",
    "main",
    "privacy",
    "rate_limit",
    "time_utils",
]
packages = ["models", "routes", "scripts", "services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised inside beanie / lazy_model, not by our code
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    # Raised inside mongomock when it handles a TTL index
    "ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock",
]
markers = [
    "guardrail: financial-safety/security guardrail tests, run as their own required CI job",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
exclude = ["\\.venv", "build"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "mongomock_motor.*"]
ignore_missing_imports = true
